name: Trigger news publisher

on:
  # Dua percobaan tiap jam, berjarak 15 menit; GitHub cron memakai UTC.
  schedule:
    - cron: '0,15 * * * *'
  workflow_dispatch:

concurrency:
  group: news-publisher
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil endpoint cron Vercel
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_URL" || -z "$CRON_SECRET" ]]; then
            echo "GitHub Secrets APP_URL dan CRON_SECRET wajib diisi."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 75 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron"
