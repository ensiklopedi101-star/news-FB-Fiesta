name: Trigger news publisher

on:
  # GitHub Actions memakai UTC. Ini menjalankan pukul 07.00, 09.00, ... 23.00 WITA.
  schedule:
    - cron: '0 1,3,5,7,9,11,13,15,23 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil endpoint cron Vercel
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_URL" || -z "$CRON_SECRET" ]]; then
            echo "GitHub Secrets APP_URL dan CRON_SECRET wajib diisi."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 75 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron"
